; =====================================================================
;  MKW - SwitchRecomp settings
;  Edit a value and save: most settings apply live while the game runs
;  (docked, language, fullscreen and frame generation apply on restart).
;  Keys in game: F1 help, F3 screenshot, F4 FPS limit, F5 trace,
;  F7 record video, F8 full-res screenshot, F11 fullscreen.
; =====================================================================

[Display]
; 1 = TV mode (1920x1080 / 1600x900 games), 0 = handheld mode (1280x720)
docked=1
; 1 = start in fullscreen (F11 or Alt+Enter toggles it in game)
fullscreen=0
; Game language: 0 Japanese, 1 English (US), 2 French, 3 German, 4 Italian, 5 Spanish,
;   6 Chinese, 7 Korean, 8 Dutch, 9 Portuguese, 10 Russian, 11 Taiwanese, 12 English (UK),
;   13 French (Canada), 14 Spanish (Latin America)
language=1
; What the on-screen keyboard answers when a game asks you to type something (names...)
keyboard_text=Player

[Controls]
; Right stick: 0 = IJKL, 1 = mouse (change with F1)
mouse_right_stick=0
; Mouse sensitivity: F1 10%..500% goes from 5x to 1250x speed, on a curve so 100% stays close to before
mouse_sensitivity=1.00
; Mouse inversion: 0 = normal, 1 = horizontal, 2 = vertical, 3 = both
mouse_invert=0

[Graphics]
; Internal 3D resolution: 1 = native, 2 = double, 0.75 / 0.5 = faster (applies live)
resolution=1
; MKW frame rate: game = its own choice, dynamic = 60 FPS while it keeps up and the game's 30 FPS mode when it doesn't (game speed stays right), 60, 30, game_dynamic = the game's per-frame mode
frame_pacing=dynamic
; 1 = lower the resolution automatically when the GPU can't keep up (down to dynamic_resolution_min)
dynamic_resolution=0
; Lowest internal resolution allowed by dynamic_resolution
dynamic_resolution_min=0.6
; 1 = let the game lower its own resolution like on the console (0 = always full resolution)
game_dynamic_resolution=0
; 0 = disable shadow maps (more FPS)
shadows=1
; Streamed textures: high, medium (their largest size left out: far less video memory), low (two sizes left out), auto = medium on cards under 6 GB, native GPU only
texture_quality=auto
; Video memory the game may fill, in MB. 0 = what the driver offers, native GPU only
video_memory_mb=0
; nvn = the game's graphics recompiled to Vulkan, gl = OpenGL renderer, eden = Eden's Vulkan GPU (needs a runtime built after tools/build_eden.sh)
gpu=nvn

[Performance]
; Experimental: 30 or 20 = draw only every 2nd / 3rd frame, the game keeps its normal speed (less GPU work,
;   effects updated on skipped frames can flicker). 120 = frame generation x2 (needs Lossless.dll, see lsfg). 60 = normal
fps_target=60
; 1 = 60 FPS, 30 = cap displayed frames at 30 while the game keeps its 60 Hz update rate, 0 = unlimited. F4 toggles between 60 and unlimited
fps_limit=1
; 1 = always wait for vsync (can lower FPS a lot on slow PCs)
forced_vsync=0
; 1 = a write through a NULL pointer stops the game with a precise log (diagnostics; 0 = normal)
null_trap=0
; Memory the game sees: 0 = automatic (3.2 GB like the console, more for games that need it,
;   e.g. Tears of the Kingdom), 4 = console (3.2 GB), 6 or 8 = extended (like yuzu's extended memory layout)
memory_gb=0
; auto = on for intel on windows (its driver crashes when compiling and drawing at the same time),
;   1 = always, 0 = never
driver_exclusive=auto
; 1 = compile shaders on a separate thread (no freezes), 0 = on the GPU thread (short freezes;
;   try it if the game crashes inside the video driver)
shader_thread=1
; 1 = compile shaders at low priority (less stutter on weak CPUs)
low_priority_shader_compiler=1

[Frame generation]
; In-game frame generation (LSFG). Uses the Lossless.dll from YOUR Lossless Scaling
;   (copy it into this folder or set lsfg_dll). Only generates frames when the game is below lsfg_target
lsfg=1
; Target FPS for frame generation
lsfg_target=60
; 2 = x2, 3 = x3, 4 = x4
lsfg_multiplier=2
; Flow scale: 1 = best quality, 0.5 = faster (recommended on integrated GPUs)
lsfg_flow=0.5
; Resolution (height) used for frame generation
lsfg_resolution=720
; Path to Lossless.dll (empty = search automatically)
lsfg_dll=
; 1 = also launch the Lossless Scaling app with the game (not needed when using lsfg)
lossless_scaling=0
; Path to LosslessScaling.exe (empty = search in Steam)
lossless_path=

[Audio]
; 1 = slow live audio smoothly when the PC cannot keep up; retain every queued sample (F1)
audio_slowdown=1

[Recording]
; 1 = F7 recordings are always smooth: the game runs in slow motion while recording
;   if the PC can't keep up, but the exported video plays at normal speed with no stutter
smooth_recording=1
; FPS of the exported video (constant)
recording_fps=60

[Debug]
; Log detail: 1 = normal, 2 = everything (slow)
log=1
; 1 = automatic diagnostic dumps (F5 always works)
diag=0
; 1 = write profile.txt every 10 seconds (CPU profiler)
profile=0
